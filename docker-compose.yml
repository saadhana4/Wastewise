services:
  db:
    image: postgis/postgis:16-3.4
    container_name: wastewise-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wastewise_db}
      POSTGRES_USER: ${POSTGRES_USER:-wastewise_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wastewise_secure_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wastewise_user} -d ${POSTGRES_DB:-wastewise_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
    driver: local
